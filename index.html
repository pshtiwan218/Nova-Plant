<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaPlant</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #2D5016;
    --green-mid: #4A7C2F;
    --green-cta: #3D9A3E;
    --green-light: #C8E6B0;
    --green-pale: #E8F5E1;
    --cream: #F7F5F0;
    --mint-bg: #D6EDD0;
    --text-dark: #1A1A1A;
    --text-muted: #6B7A5E;
    --white: #FFFFFF;
    --radius-blob: 60% 40% 55% 45% / 50% 60% 40% 50%;
    --toggle-bg: rgba(45, 80, 22, 0.1);
    --toggle-active: #00c896;
    --primary: #10B981;
    --card-bg: #ffffff;
    --bg-chapters: #f0f7ec;
    --bg-footer: #1e3a1a;
    --text-main: #1A1A1A;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.10);
    --border-nav: 1px solid rgba(16,185,129,0.15);
    --arrow-hover-transform: translateY(5px);
  }

  body.dark-mode {
    --cream: #12180e;
    --text-dark: #F7F5F0;
    --text-muted: #a3b299;
    --white: #1a2315;
    --mint-bg: #223518;
    --toggle-bg: rgba(255,255,255,0.1);
    --card-bg: #1e2d18;
    --bg-chapters: #141f0e;
    --text-main: #e8f5e1;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.35);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Noto Kufi Arabic', 'Poppins', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* ── NAV ── */
  nav.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 5%;
    background: rgba(247, 245, 240, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: var(--border-nav);
    gap: 1rem;
  }

  body.dark-mode nav.navbar {
    background: rgba(18, 24, 14, 0.8);
    border-bottom: 1px solid rgba(16,185,129,0.1);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--green-dark);
    text-decoration: none;
    flex-shrink: 0;
    animation: logoFloat 4s ease-in-out infinite;
  }

  body.dark-mode .logo {
    color: #ffffff;
  }

  .logo svg {
    width: 26px;
    height: 26px;
    stroke: var(--green-cta);
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .search-container {
    flex-grow: 1;
    max-width: 450px;
    margin: 0 1.5rem;
    position: relative;
  }

  .search-wrapper {
    position: relative;
    width: 100%;
  }

  .search-input {
    width: 100%;
    padding: 0.6rem 2.8rem 0.6rem 1.2rem;
    border: 1.5px solid rgba(74, 124, 47, 0.2);
    background: rgba(255, 255, 255, 0.8);
    border-radius: 50px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text-dark);
    outline: none;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html[dir="ltr"] .search-input {
    padding: 0.6rem 1.2rem 0.6rem 2.8rem;
  }

  body.dark-mode .search-input {
    background: rgba(30, 45, 24, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
    color: #ffffff;
  }

  .search-input:focus {
    border-color: var(--green-cta);
    background: var(--white) !important;
    color: var(--text-dark) !important;
    box-shadow: 0 0 0 4px rgba(61, 154, 62, 0.15);
    transform: scale(1.01);
  }

  .search-icon {
    position: absolute;
    top: 50%;
    right: 1rem;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-muted);
    pointer-events: none;
    transition: stroke 0.3s;
  }

  html[dir="ltr"] .search-icon {
    right: auto;
    left: 1rem;
  }

  body.dark-mode .search-icon {
    stroke: var(--text-muted);
  }

  .search-input:focus + .search-icon {
    stroke: var(--green-cta) !important;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: .6rem;
  }

  .mobile-search-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(74, 124, 47, 0.2);
    background: rgba(255,255,255,0.6);
    color: var(--text-muted);
    flex-shrink: 0;
    cursor: pointer;
  }

  body.dark-mode .mobile-search-btn {
    background: rgba(30, 45, 24, 0.6);
    border-color: rgba(255,255,255,0.1);
    color: var(--text-muted);
  }

  .mobile-search-btn svg {
    width: 17px;
    height: 17px;
  }

  .theme-switcher-container,
  .lang-switcher-container {
    display: flex;
    background: var(--toggle-bg);
    border: 1px solid rgba(0,0,0,0.05);
    padding: 2px;
    border-radius: 50px;
  }

  body.dark-mode .theme-switcher-container,
  body.dark-mode .lang-switcher-container {
    border-color: rgba(255,255,255,0.05);
    background: rgba(255,255,255,0.05);
  }

  .theme-switcher-container button,
  .lang-switcher-container button {
    background: none;
    border: none;
    padding: .35rem .7rem;
    font-size: .75rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 50px;
    transition: color 0.3s ease, background 0.3s ease;
    font-family: inherit;
  }

  body.dark-mode .theme-switcher-container button,
  body.dark-mode .lang-switcher-container button {
    color: #a3b299;
  }

  .theme-btn.active,
  .lang-btn.active {
    background: var(--toggle-active);
    color: #ffffff !important;
    box-shadow: 0 2px 6px rgba(0,200,150,0.3);
  }

  /* ── NAVIGATION MENU ── */
  .menu-toggle {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(74,124,47,0.18);
    border-radius: 13px;
    background: rgba(255,255,255,0.72);
    color: var(--green-dark);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .3s ease, background .3s ease, box-shadow .3s ease;
    font-family: inherit;
  }

  .menu-toggle:hover {
    transform: translateY(-2px);
    background: var(--white);
    box-shadow: 0 8px 20px rgba(45,80,22,.12);
  }

  .menu-toggle svg {
    width: 21px;
    height: 21px;
    transition: transform .35s ease;
  }

  .menu-toggle.active svg {
    transform: rotate(90deg);
  }

  body.dark-mode .menu-toggle {
    background: rgba(30,45,24,.75);
    border-color: rgba(255,255,255,.12);
    color: #86efac;
  }

  .nav-menu-panel {
    position: absolute;
    top: calc(100% + 12px);
    right: 5%;
    width: min(390px, calc(100vw - 32px));
    max-height: min(70vh, 560px);
    padding: 14px;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(16,185,129,.16);
    border-radius: 22px;
    box-shadow: 0 22px 55px rgba(26,70,30,.18);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-12px) scale(.97);
    transform-origin: top right;
    transition:
      opacity .28s ease,
      transform .32s cubic-bezier(.2,.8,.2,1),
      visibility .28s;
    z-index: 120;
  }

  html[dir="ltr"] .nav-menu-panel {
    right: auto;
    left: 5%;
    transform-origin: top left;
  }

  .nav-menu-panel.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  body.dark-mode .nav-menu-panel {
    background: rgba(18,24,14,.96);
    border-color: rgba(134,239,172,.12);
    box-shadow: 0 22px 55px rgba(0,0,0,.4);
  }

  .nav-menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 7px 12px;
    border-bottom: 1px solid rgba(16,185,129,.12);
    margin-bottom: 10px;
  }

  .nav-menu-title {
    color: var(--green-dark);
    font-size: 1rem;
    font-weight: 700;
  }

  body.dark-mode .nav-menu-title {
    color: #86efac;
  }

  .nav-menu-count {
    min-width: 30px;
    height: 26px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background: rgba(16,185,129,.1);
    color: var(--primary);
    font-size: .72rem;
    font-weight: 700;
  }

  .nav-menu-list {
    display: grid;
    gap: 7px;
  }

  .nav-menu-item {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--text-dark);
    text-align: start;
    cursor: pointer;
    font-family: inherit;
    transition:
      transform .25s ease,
      background .25s ease,
      border-color .25s ease,
      box-shadow .25s ease;
    animation: menuItemIn .38s both;
  }

  .nav-menu-item:hover {
    transform: translateX(-4px);
    background: rgba(16,185,129,.08);
    border-color: rgba(16,185,129,.15);
    box-shadow: 0 7px 18px rgba(16,185,129,.08);
  }

  html[dir="ltr"] .nav-menu-item:hover {
    transform: translateX(4px);
  }

  body.dark-mode .nav-menu-item {
    color: #e8f5e1;
  }

  .nav-menu-number {
    width: 31px;
    height: 31px;
    flex: 0 0 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: linear-gradient(
      135deg,
      rgba(16,185,129,.16),
      rgba(74,124,47,.12)
    );
    color: var(--green-mid);
    font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif;
    font-size: .72rem;
    font-weight: 700;
  }

  .nav-menu-item-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: .78rem;
    font-weight: 600;
  }

  @keyframes menuItemIn {
    from {
      opacity: 0;
      transform: translateY(-7px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .nav-menu-empty {
    padding: 22px 10px;
    text-align: center;
    color: var(--text-muted);
    font-size: .78rem;
  }

  /* ── SEARCH RESULT ── */
  .search-result-count {
    position: absolute;
    top: calc(100% + 7px);
    right: 15px;
    background: var(--white);
    color: var(--green-mid);
    border: 1px solid rgba(16,185,129,.12);
    border-radius: 50px;
    padding: 4px 10px;
    font-size: .68rem;
    box-shadow: var(--shadow-sm);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-5px);
    transition: all .25s ease;
    z-index: 5;
  }

  .search-result-count.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  html[dir="ltr"] .search-result-count {
    right: auto;
    left: 15px;
  }

  .chapter-card.search-match {
    animation: searchPulse .45s ease;
  }

  @keyframes searchPulse {
    0% {
      transform: scale(.985);
      opacity: .55;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 1000px) {
    nav.navbar {
      padding: .8rem 4%;
    }

    .search-container {
      margin: 0 .7rem;
      max-width: 360px;
    }

    .theme-switcher-container button,
    .lang-switcher-container button {
      padding: .3rem .55rem;
    }
  }

  @media (max-width: 760px) {
    nav.navbar {
      padding: .7rem 4%;
      gap: .5rem;
    }

    .logo {
      font-size: 1.15rem;
    }

    .logo svg {
      width: 22px;
      height: 22px;
    }

    .search-container {
      position: absolute;
      top: calc(100% + 9px);
      left: 4%;
      right: 4%;
      width: auto;
      max-width: none;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all .3s ease;
    }

    .search-container.mobile-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .mobile-search-btn {
      display: inline-flex;
    }

    .nav-actions {
      gap: .35rem;
    }

    .theme-switcher-container button,
    .lang-switcher-container button {
      padding: .28rem .5rem;
      font-size: .68rem;
    }

    .menu-toggle {
      width: 38px;
      height: 38px;
    }

    .nav-menu-panel {
      right: 4%;
      left: 4%;
      width: auto;
      max-height: 65vh;
    }

    html[dir="ltr"] .nav-menu-panel {
      left: 4%;
      right: 4%;
    }
  }

  @media (max-width: 500px) {
    .logo {
      font-size: 1rem;
    }

    .theme-switcher-container,
    .lang-switcher-container {
      display: none;
    }

    .nav-menu-panel {
      border-radius: 18px;
      padding: 11px;
    }

    .nav-menu-item {
      padding: 9px 10px;
    }

    .nav-menu-item-text {
      font-size: .72rem;
    }

    .search-input {
      font-size: .78rem;
    }
  }
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav class="navbar">

  <a href="#" class="logo">

      <path d="M12 20V10"></path>
      <path d="M12 10C8 10 5 7 5 3c4 0 7 3 7 7Z"></path>
      <path d="M12 14c4 0 7-3 7-7-4 0-7 3-7 7Z"></path>
    </svg>
    <span>NovaPlant</span>
  </a>

  <div class="search-container" id="search-container">
    <div class="search-wrapper">
      <input
        id="search-bar"
        class="search-input"
        type="search"
        placeholder="گەڕان بەدوای بەشەکاندا..."
        autocomplete="off"
      >

      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <div id="search-result-count" class="search-result-count"></div>

  </div>

  <div class="nav-actions">

    <button
      class="mobile-search-btn"
      type="button"
      onclick="toggleMobileSearch()"
      aria-label="Search"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
    </button>

    <div class="theme-switcher-container">
      <button
        id="theme-light-btn"
        class="theme-btn active"
        onclick="setTheme('light')"
      >
        ڕووناک
      </button>

      <button
        id="theme-dark-btn"
        class="theme-btn"
        onclick="setTheme('dark')"
      >
        تاریک
      </button>
    </div>

    <div class="lang-switcher-container">
      <button
        id="btn-ku"
        class="lang-btn active"
        onclick="changeLanguage('ku')"
      >
        کوردی
      </button>

      <button
        id="btn-ar"
        class="lang-btn"
        onclick="changeLanguage('ar')"
      >
        عربي
      </button>

      <button
        id="btn-en"
        class="lang-btn"
        onclick="changeLanguage('en')"
      >
        EN
      </button>
    </div>

    <!-- MENU BUTTON -->
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      onclick="toggleNavigationMenu()"
      aria-expanded="false"
      aria-controls="nav-menu-panel"
      aria-label="Menu"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 17h16"></path>
      </svg>
    </button>

  </div>

  <!-- MENU PANEL -->
  <div
    id="nav-menu-panel"
    class="nav-menu-panel"
    aria-hidden="true"
  >
    <div class="nav-menu-head">
      <div id="nav-menu-title" class="nav-menu-title">
        بەشەکانی پلاتفۆرم
      </div>

      <div id="nav-menu-count" class="nav-menu-count">
        12
      </div>
    </div>

    <div id="nav-menu-list" class="nav-menu-list"></div>
  </div>

</nav>


<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-content">
    <div id="hero-eyebrow"></div>

    <h1 id="hero-title"></h1>

    <p id="hero-desc-txt"></p>

    <a href="#chapters" class="hero-btn">
      <span id="btn-txt"></span>
    </a>
  </div>
</section>


<!-- CHAPTERS -->
<section id="chapters" class="chapters-section">

  <div class="section-heading">
    <h2 id="sec-title"></h2>
    <p id="sec-subtitle"></p>
  </div>

  <div id="grid-container" class="grid-container"></div>

</section>


<!-- FOOTER -->

      <h3 id="foot-title-col1"></h3>

      <h4 id="foot-main-title-custom"></h4>

      <p id="foot-desc-custom"></p>

    <div class="footer-column">

      <ul id="footer-chapters-list-col"></ul>

    <div class="footer-column">

    </div>

  </div>

  <div class="footer-bottom">
    <p id="foot-rights"></p>
    <p id="foot-developer"></p>

</footer>

  function changeLanguage(lang) {

    const data = translations[lang];

    const html = document.getElementById("html-tag");

    html.setAttribute("dir", data.dir);
    html.setAttribute("lang", lang);

    document.querySelectorAll('.lang-btn')
      .forEach(b => b.classList.remove('active'));

    document
      .getElementById(`btn-${lang}`)
      .classList.add('active');

    document.getElementById("search-bar").placeholder =
      data.searchPlaceholder;

    document.getElementById("search-bar").value = "";

    document
      .getElementById("search-result-count")
      .classList.remove("show");

    document.getElementById("nav-menu-title").innerText =
      data.menuTitle;

    document.getElementById("search-result-count").innerText = "";

    document.getElementById("hero-eyebrow").innerText =
      data.eyebrow;

    document.getElementById("hero-desc-txt").innerText =
      data.heroDesc;

    document.getElementById("btn-txt").innerText =
      data.btn;

    document.getElementById("theme-light-btn").innerText =
      data.lightBtn;

    document.getElementById("theme-dark-btn").innerText =
      data.darkBtn;

    document.getElementById("sec-title").innerText =
      data.secTitle;

    document.getElementById("sec-subtitle").innerText =
      data.secSubtitle;

    document.getElementById("foot-title-col1").innerText =
      data.footCol1;

    document.getElementById("foot-title-col2").innerText =
      data.footCol2;

    document.getElementById("foot-title-col3").innerText =
      data.footCol3;

    document.getElementById("foot-title-col4").innerText =
      data.footCol4;

    const infoAcademicEl =
      document.getElementById("foot-info-academic");

    if (infoAcademicEl) {
      infoAcademicEl.innerHTML = data.footAcademic;
    }

    document.getElementById("foot-main-title-custom").innerText =
      data.footTitle;

    document.getElementById("foot-desc-custom").innerText =
      data.footDesc;

    document.getElementById("foot-view-text").innerText =
      data.footViews;

    document.getElementById("foot-rights").innerText =
      data.footRights;

    document.getElementById("foot-developer").innerText =
      data.footDev;


    const titleContainer =
      document.getElementById("hero-title");

    titleContainer.innerHTML = "";

    const words = data.title.split(" ");

    words.forEach((word, index) => {

      const span = document.createElement("span");

      span.innerText = word;

      titleContainer.appendChild(span);

      if (index < words.length - 1) {

        const space =
          document.createTextNode(" ");

        titleContainer.appendChild(space);

      }

    });


    renderGrid(data.chapters, data);

    renderFooterChaptersColumn(data.chapters);

    renderNavigationMenu(data.chapters, data);
  }


  function renderGrid(chaptersList, data) {

    const container =
      document.getElementById("grid-container");

    container.innerHTML = "";

    chaptersList.forEach((item, index) => {

      const delay = (index % 3) * 0.3;

      container.innerHTML += `

        <div
          class="chapter-card"
          id="chapter-id-${index}"
        >

          <div class="card-image-area">

            <span class="card-chapter-tag">
              ${data.tagStr}${item.ch}
            </span>

            <img
              src="${item.img}"
              alt="${item.title}"
              loading="lazy"
            >

          </div>

          <div class="card-content-box">

            <h3
              class="card-title"
              style="animation-delay: ${delay}s"
            >
              ${item.title}
            </h3>

            <p class="card-desc">
              ${item.desc}
            </p>

            <a
              href="javascript:void(0)"
              class="card-footer-btn"
            >
              ${data.readMore}
            </a>

          </div>

        </div>

      `;

    });

  }


  function renderFooterChaptersColumn(chaptersList) {

    const columnContainer =
      document.getElementById("footer-chapters-list-col");

    columnContainer.innerHTML = "";

    chaptersList.forEach((item, index) => {

      columnContainer.innerHTML += `

        <li>
          <a
            href="javascript:void(0)"
            onclick="
              document
                .getElementById('chapter-id-${index}')
                .scrollIntoView({
                  behavior:'smooth'
                })
            "
          >
            ${item.title}
          </a>
        </li>

      `;

    });

  }


  /* ── NAVIGATION MENU ── */

  function renderNavigationMenu(chaptersList, data) {

    const list =
      document.getElementById("nav-menu-list");

    const count =
      document.getElementById("nav-menu-count");

    list.innerHTML = "";

    count.innerText = chaptersList.length;

    chaptersList.forEach((item, index) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "nav-menu-item";

      button.style.animationDelay =
        `${index * 0.035}s`;

      button.innerHTML = `

        <span class="nav-menu-number">
          ${item.ch}
        </span>

        <span class="nav-menu-item-text">
          ${item.title}
        </span>

      `;

      button.addEventListener("click", () => {

        const target =
          document.getElementById(
            `chapter-id-${index}`
          );

        if (target) {

          closeNavigationMenu();

          target.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

          target.classList.remove("search-match");

          void target.offsetWidth;

          target.classList.add("search-match");
        }

      });

      list.appendChild(button);

    });

  }


  function toggleNavigationMenu() {

    const panel =
      document.getElementById("nav-menu-panel");

    const toggle =
      document.getElementById("menu-toggle");

    const isOpen =
      panel.classList.toggle("open");

    toggle.classList.toggle(
      "active",
      isOpen
    );

    toggle.setAttribute(
      "aria-expanded",
      String(isOpen)
    );

    panel.setAttribute(
      "aria-hidden",
      String(!isOpen)
    );

  }


  function closeNavigationMenu() {

    const panel =
      document.getElementById("nav-menu-panel");

    const toggle =
      document.getElementById("menu-toggle");

    panel.classList.remove("open");

    toggle.classList.remove("active");

    toggle.setAttribute(
      "aria-expanded",
      "false"
    );

    panel.setAttribute(
      "aria-hidden",
      "true"
    );

  }


  /* ── CLOSE MENU WHEN CLICKING OUTSIDE ── */

  document.addEventListener("click", function(e) {

    const panel =
      document.getElementById("nav-menu-panel");

    const toggle =
      document.getElementById("menu-toggle");

    if (
      panel &&
      panel.classList.contains("open") &&
      !panel.contains(e.target) &&
      !toggle.contains(e.target)
    ) {

      closeNavigationMenu();

    }

  });


  /* ── SEARCH ── */

  document
    .getElementById("search-bar")
    .addEventListener("input", function(e) {

      const term =
        e.target.value
          .toLocaleLowerCase()
          .trim();

      const cards =
        document.querySelectorAll(".chapter-card");

      let matches = 0;

      cards.forEach(card => {

        const title =
          card
            .querySelector(".card-title")
            ?.innerText
            .toLocaleLowerCase() || "";

        const desc =
          card
            .querySelector(".card-desc")
            ?.innerText
            .toLocaleLowerCase() || "";

        const tag =
          card
            .querySelector(".card-chapter-tag")
            ?.innerText
            .toLocaleLowerCase() || "";

        const matched =
          !term ||
          title.includes(term) ||
          desc.includes(term) ||
          tag.includes(term);

        card.style.display =
          matched ? "flex" : "none";

        if (matched && term) {

          matches++;

          card.classList.remove(
            "search-match"
          );

          void card.offsetWidth;

          card.classList.add(
            "search-match"
          );

        } else {

          card.classList.remove(
            "search-match"
          );

        }

      });


      const result =
        document.getElementById(
          "search-result-count"
        );

      if (term) {

        result.innerText =
          `${matches} ${
            matches === 1
              ? "result"
              : "results"
          }`;

        result.classList.add("show");

      } else {

        result.innerText = "";

        result.classList.remove("show");

      }

    });


  function toggleMobileSearch() {

    const sc =
      document.getElementById(
        "search-container"
      );

    sc.classList.toggle(
      "mobile-open"
    );

    if (
      sc.classList.contains(
        "mobile-open"
      )
    ) {

      document
        .getElementById("search-bar")
        .focus();

    }

  }


  function setTheme(mode) {

    document
      .querySelectorAll('.theme-btn')
      .forEach(
        b => b.classList.remove('active')
      );

    if (mode === 'dark') {

      document.body.classList.add(
        "dark-mode"
      );

      document
        .getElementById("theme-dark-btn")
        .classList.add("active");

    } else {

      document.body.classList.remove(
        "dark-mode"
      );

      document
        .getElementById("theme-light-btn")
        .classList.add("active");

    }

  }


  function setupViewCounter() {

    let totalViews =
      localStorage.getItem(
        "novaplant_clean_views"
      ) || 0;

    if (
      !sessionStorage.getItem(
        "novaplant_session_clean"
      )
    ) {

      totalViews =
        parseInt(totalViews) + 1;

      localStorage.setItem(
        "novaplant_clean_views",
        totalViews
      );

      sessionStorage.setItem(
        "novaplant_session_clean",
        "true"
      );

    }

    document
      .getElementById("view-count-num")
      .innerText = totalViews;

  }


  window.onload = function() {

    setupViewCounter();

    changeLanguage('ku');

  };
